  <!-- Compass -->
  <circle cx="730" cy="70" r="25" fill="#333" opacity="0.7"/>
  <line x1="730" y1="45" x2="730" y2="95" stroke="#fff" stroke-width="1"/>
  <line x1="705" y1="70" x2="755" y2="70" stroke="#fff" stroke-width="1"/>
  <text x="730" y="55" font-family="Arial" font-size="10" fill="#fff" text-anchor="middle">N</text>
  <text x="730" y="90" font-family="Arial" font-size="10" fill="#fff" text-anchor="middle">S</text>
  <text x="710" y="70" font-family="Arial" font-size="10" fill="#fff" text-anchor="middle">W</text>
  <text x="750" y="70" font-family="Arial" font-size="10" fill="#fff" text-anchor="middle">E</text>
  
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">BambooMade Workshop Locations</text>
  
  <!-- Legend -->
  <rect x="40" y="420" width="15" height="15" fill="#77DD77"/>
  <text x="65" y="432" font-family="Arial" font-size="12" fill="#ffffff">Workshop Locations</text>
